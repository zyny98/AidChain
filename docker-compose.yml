version: "3.9"

services:
  # ─── Backend (FastAPI) ───────────────────────────────────────
  backend:
    build: ./backend
    container_name: cleargarant-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    networks:
      - cleargarant

  # ─── Frontend (Next.js) ──────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: cleargarant-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
    networks:
      - cleargarant

  # ─── Hardhat Node (local blockchain) ─────────────────────────
  hardhat:
    image: node:20-alpine
    container_name: cleargarant-hardhat
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./contracts:/app
    command: sh -c "npm install && npx hardhat node --hostname 0.0.0.0"
    ports:
      - "8545:8545"
    networks:
      - cleargarant

networks:
  cleargarant:
    driver: bridge
